<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>苏州德力 · 产品展示</title>
<style>
  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5aa;
    --gold-dark: #a88840;
    --dark: #1a1a2e;
    --text: #2c2c2c;
    --text-sub: #666;
    --bg: #f0ece6;
    --bg-pattern: rgba(201,169,110,0.04);
    --card-bg: #ffffff;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.04);
    --card-shadow-hover: 0 4px 16px rgba(0,0,0,0.1), 0 12px 40px rgba(0,0,0,0.06);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201,169,110,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(26,26,46,0.03) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶部 Banner ===== */
  .header {
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
    padding: 44px 20px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(201,169,110,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 30%, rgba(201,169,110,0.08) 0%, transparent 40%);
    pointer-events: none;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent);
  }
  .header-logo {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 8px;
    text-shadow: 0 2px 20px rgba(201,169,110,0.3);
    position: relative;
  }
  .header-logo span {
    background: linear-gradient(135deg, #c9a96e, #e8d5aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-sub {
    margin-top: 8px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 4px;
    font-weight: 300;
    position: relative;
  }
  .header-divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 16px auto 0;
    position: relative;
  }

  /* ===== 搜索 / 字母筛选区 ===== */
  .search-section {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(240,236,230,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    padding: 16px 16px 14px;
    transition: box-shadow 0.3s;
  }
  .search-section.scrolled {
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .search-title {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-bottom: 10px;
    letter-spacing: 2px;
    font-weight: 400;
  }
  .search-title em {
    color: var(--gold-dark);
    font-style: normal;
    font-weight: 600;
  }

  /* 输入框 */
  .search-input-wrap {
    position: relative;
    max-width: 360px;
    margin: 0 auto 12px;
  }
  .search-input {
    width: 100%;
    padding: 11px 42px 11px 18px;
    border: 1.5px solid rgba(201,169,110,0.25);
    border-radius: 28px;
    font-size: 15px;
    background: rgba(255,255,255,0.8);
    color: var(--text);
    outline: none;
    transition: all 0.25s;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .search-input:focus {
    border-color: var(--gold);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(201,169,110,0.1);
  }
  .search-input::placeholder { color: #c5c0b8; font-size: 13px; letter-spacing: 1px; }
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #bbb;
    font-size: 18px;
    display: none;
  }
  .search-clear.show { display: block; }

  /* 字母快捷键 */
  .alpha-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    max-width: 480px;
    margin: 0 auto;
  }
  .alpha-btn {
    min-width: 32px;
    height: 32px;
    padding: 0 7px;
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.6);
    color: #888;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .alpha-btn:hover { background: rgba(201,169,110,0.12); border-color: var(--gold); color: var(--gold-dark); transform: translateY(-1px); }
  .alpha-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
    box-shadow: 0 3px 12px rgba(201,169,110,0.4);
    transform: translateY(-1px);
  }
  .alpha-btn.all-btn {
    padding: 0 12px;
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    border-color: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    letter-spacing: 2px;
  }
  .alpha-btn.all-btn:hover, .alpha-btn.all-btn.active {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #fff;
  }

  /* 统计信息 */
  .result-count {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
    min-height: 16px;
  }
  .result-count strong { color: var(--gold); }

  /* ===== 产品网格 ===== */
  .products-wrap {
    padding: 24px 12px 60px;
    max-width: 960px;
    margin: 0 auto;
  }

  /* 字母分组标题 */
  .group-title {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 4px 12px;
  }
  .group-title .letter-badge {
    width: 40px;
    height: 40px;
    background: linear-gradient(145deg, var(--dark), #0f3460);
    color: var(--gold);
    font-size: 20px;
    font-weight: 800;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(26,26,46,0.25);
    letter-spacing: 0;
  }
  .group-title .group-name {
    font-size: 12px;
    color: #bbb;
    letter-spacing: 2px;
    font-weight: 400;
  }

  /* 产品卡片网格 */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 600px) {
    .product-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  }
  @media (min-width: 900px) {
    .product-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
  }

  /* 产品卡片 */
  .product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.35s;
    cursor: pointer;
    position: relative;
    opacity: 0;
    animation: cardReveal 0.5s ease forwards;
  }
  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--card-shadow-hover);
  }
  .product-card:active { transform: translateY(-2px) scale(0.99); }
  .product-card.hidden { display: none; }

  /* 图片 —— 原背景色延伸 */
  .card-img-wrap {
    width: 100%;
    aspect-ratio: 4/5;
    overflow: hidden;
    background: #ffffff;
    position: relative;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    display: block;
  }
  .product-card:hover .card-img-wrap img { transform: scale(1.04); }

  /* 图片底部渐变遮罩 */
  .card-img-wrap::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(to top, rgba(255,255,255,0.8), transparent);
    pointer-events: none;
  }

  /* 图片占位 */
  .card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ccc;
    gap: 6px;
  }
  .card-img-placeholder .ph-icon { font-size: 32px; }
  .card-img-placeholder .ph-text { font-size: 11px; }

  /* 卡片内容 */
  .card-body {
    padding: 14px 14px 16px;
    position: relative;
  }
  .card-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .card-spec-label {
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .card-spec {
    border-top: 1px dashed rgba(201,169,110,0.25);
    padding-top: 6px;
  }
  .spec-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 10.5px;
    line-height: 1.5;
  }
  .spec-row:last-child { margin-bottom: 0; }
  .spec-type {
    flex-shrink: 0;
    width: 42px;
    color: #9a7030;
    font-weight: 600;
    text-align: left;
  }
  .spec-sizes {
    flex: 1;
    color: #888;
    word-break: break-all;
  }
  .spec-size-item {
    display: inline-block;
    background: #f5f2ed;
    border-radius: 3px;
    padding: 1px 5px;
    margin: 1px 2px 1px 0;
    white-space: nowrap;
    font-size: 10px;
  }
  /* 相册名行：另起一行，上方加细分隔线 */
  .spec-row-album {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed rgba(201,169,110,0.2);
  }
  .spec-type-album {
    width: auto;
    min-width: 42px;
    max-width: 80px;
    color: #6a5020;
    font-size: 10px;
  }

  /* ===== 详情弹窗 ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 520px;
    border-radius: 24px 24px 0 0;
    padding: 0 0 env(safe-area-inset-bottom);
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.show .modal-box {
    transform: translateY(0);
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #e0ddd8;
    border-radius: 2px;
    margin: 10px auto 0;
  }
  .modal-img-wrap {
    width: 100%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-img-wrap img {
    width: 100%;
    object-fit: cover;
    display: block;
  }
  .modal-content {
    padding: 22px 22px 36px;
  }
  .modal-name {
    font-size: 24px;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 4px;
    letter-spacing: 3px;
  }
  .modal-name-en {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 18px;
    font-weight: 400;
    opacity: 0.7;
  }
  .modal-section-title {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    font-weight: 600;
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .modal-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(201,169,110,0.25), transparent);
  }
  .modal-spec-table {
    width: 100%;
    border-collapse: collapse;
  }
  .modal-spec-table tr + tr td { padding-top: 6px; }
  .modal-spec-table td { vertical-align: top; }
  .modal-spec-col-type {
    width: 64px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-dark);
    padding-right: 12px;
    white-space: nowrap;
    padding-top: 2px;
  }
  .modal-spec-col-sizes {
    font-size: 12.5px;
    color: #555;
    line-height: 2;
  }
  .modal-size-chip {
    display: inline-block;
    background: rgba(240,236,230,0.6);
    border: 1px solid rgba(201,169,110,0.12);
    border-radius: 6px;
    padding: 2px 10px;
    margin: 2px 4px 2px 0;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .modal-size-chip:hover {
    background: rgba(201,169,110,0.12);
  }
  /* 弹窗相册名分隔线行 */
  .modal-spec-divider td {
    padding: 4px 0 2px !important;
    border-top: 1px dashed rgba(201,169,110,0.3);
  }
  /* 弹窗相册名行 */
  .modal-spec-album-row td { padding-top: 4px !important; }
  .modal-spec-col-album {
    font-size: 12px !important;
    color: #6a5020 !important;
    font-weight: 600 !important;
    width: auto !important;
    min-width: 64px;
  }
  .modal-intro {
    font-size: 14px;
    color: var(--text-sub);
    line-height: 2;
    margin-top: 10px;
    text-indent: 2em;
    letter-spacing: 0.5px;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    background: rgba(0,0,0,0.1);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* ===== 空状态 ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; color: #aaa; }

  /* ===== 底部 ===== */
  .footer {
    text-align: center;
    padding: 28px 20px;
    font-size: 11px;
    color: #c5c0b8;
    letter-spacing: 3px;
    border-top: 1px solid rgba(201,169,110,0.08);
  }

  /* 动画 */
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .product-card { animation: none; opacity: 1; }
    .product-card:hover { transform: none; }
    .card-img-wrap img { transition: none; }
  }
</style>
</head>
<body>

<!-- 顶部 Banner -->
<header class="header">
  <div class="header-logo"><span>苏州</span>德力</div>
  <div class="header-sub">SUZHOU DELI · PRODUCT GALLERY</div>
  <div class="header-divider"></div>
</header>

<!-- 搜索 & 字母筛选 -->
<div class="search-section">
  <div class="search-title">输入产品拼音首字母，快速查找 <em>效果图</em></div>
  <div class="search-input-wrap">
    <input class="search-input" id="searchInput" type="text" maxlength="10"
      placeholder="如：输入 B 搜索北斋、巴黎世家…" autocomplete="off" autocorrect="off" spellcheck="false">
    <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
  </div>
  <div class="alpha-bar" id="alphaBar"></div>
  <div class="result-count" id="resultCount"></div>
</div>

<!-- 产品展示区 -->
<div class="products-wrap" id="productsWrap">
  <!-- JS 动态填充 -->
</div>

<!-- 空状态 -->
<div class="empty-state" id="emptyState">
  <div class="empty-icon">🔍</div>
  <div class="empty-text">未找到匹配的产品，换个字母试试</div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 底部 -->
<footer class="footer">© 苏州德力 · 版权所有</footer>

<script>

  { name: "北斋", pinyin: "BZ", spec: "艺术照/110x60cm-1 组合照/50x45cm-1/18x32cm-2/20x20cm-2 摆台/17x17cm-1/15x20cm-1", intro: "" },

// ==================== 规格解析 ====================
/**
 * 将规格字符串解析为 [{type, sizes, isAlbum}] 结构
 * type: '艺术照'|'组合照'|'摆台'|中文相册名
 * sizes: 尺寸数组
 * isAlbum: true 表示摆台之后的中文相册名行，另起一行左对齐
 */
function parseSpecItems(spec) {
  if (!spec) return [];
  const result = [];
  const MAIN_TYPES = ['艺术照', '组合照', '摆台'];

  // 用正则按三大类型切分，保留分隔符
  // 格式：类型名/尺寸1/尺寸2...  中文相册名/尺寸1/尺寸2...
  const cleaned = spec.replace(/\s+/g, ' ').trim();

  // 先提取三大类型段落
  // 思路：找所有"艺术照/"、"组合照/"、"摆台/"的位置，依次切段
  const typePattern = /(艺术照|组合照|摆台)\//g;
  const matches = [];
  let m;
  while ((m = typePattern.exec(cleaned)) !== null) {
    matches.push({ index: m.index, type: m[1] });
  }

  if (matches.length === 0) {
    // 没有标准类型，全部作为相册名行
    result.push({ type: '', sizes: [cleaned], isAlbum: true });
    return result;
  }

  // 按匹配位置切段
  for (let i = 0; i < matches.length; i++) {
    const start = matches[i].index + matches[i].type.length + 1; // 跳过"类型/"
    const end = i + 1 < matches.length ? matches[i + 1].index : cleaned.length;
    const segRaw = cleaned.slice(start, end).trim();

    if (matches[i].type !== '摆台') {
      // 艺术照、组合照：直接按/分割尺寸
      const sizes = segRaw.split('/').map(s => s.trim()).filter(s => s);
      result.push({ type: matches[i].type, sizes, isAlbum: false });
    } else {
      // 摆台段：摆台尺寸在前，之后可能跟 "中文名/尺寸/尺寸"
      // 找第一个中文字开头的非尺寸部分
      // 策略：找"[中文]{1,8}/"模式作为相册名起点
      const albumSplit = segRaw.match(/^(.*?)\s+([\u4e00-\u9fa5A-Z][^\s\/]{0,12}\/.*)?$/s);
      
      // 更精确：按"空格+中文开头词/"切分
      const albumIdx = segRaw.search(/\s+[\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9\s]{0,10}\//);
      
      if (albumIdx !== -1) {
        // 摆台尺寸部分
        const plateSizes = segRaw.slice(0, albumIdx).trim().split('/').map(s => s.trim()).filter(s => s);
        result.push({ type: '摆台', sizes: plateSizes, isAlbum: false });

        // 相册名及其尺寸（可能多组）
        const albumPart = segRaw.slice(albumIdx).trim();
        // 再次按"空格+中文/英文字母开头词"分割多个相册名
        const albumChunks = albumPart.split(/\s+(?=[\u4e00-\u9fa5A-Za-z])/);
        albumChunks.forEach(chunk => {
          chunk = chunk.trim();
          if (!chunk) return;
          const slashIdx = chunk.indexOf('/');
          if (slashIdx !== -1) {
            const albumName = chunk.slice(0, slashIdx).trim();
            const albumSizes = chunk.slice(slashIdx + 1).split('/').map(s => s.trim()).filter(s => s);
            if (albumName) result.push({ type: albumName, sizes: albumSizes, isAlbum: true });
          } else {
            result.push({ type: chunk, sizes: [], isAlbum: true });
          }
        });
      } else {
        // 摆台后无相册名，全部是尺寸
        const sizes = segRaw.split('/').map(s => s.trim()).filter(s => s);
        result.push({ type: '摆台', sizes, isAlbum: false });
      }
    }
  }

  return result;
}

// 卡片内规格渲染（紧凑版）
function renderSpecTags(spec) {
  if (!spec) return '<span style="color:#ccc;font-size:10px">暂无规格</span>';
  const items = parseSpecItems(spec);
  if (items.length === 0) return `<div class="spec-row"><span class="spec-sizes">${spec}</span></div>`;

  return items.map(item => {
    if (item.isAlbum) {
      // 相册名：另起一行，左对齐，带分隔线
      return `
        <div class="spec-row spec-row-album">
          <span class="spec-type spec-type-album">${item.type}</span>
          <span class="spec-sizes">${item.sizes.map(s =>
            `<span class="spec-size-item">${s}</span>`
          ).join('')}</span>
        </div>`;
    }
    return `
      <div class="spec-row">
        <span class="spec-type">${item.type}</span>
        <span class="spec-sizes">${item.sizes.map(s =>
          `<span class="spec-size-item">${s}</span>`
        ).join('')}</span>
      </div>`;
  }).join('');
}

// 弹窗内规格渲染（详细版，表格对齐）
function renderModalSpec(spec) {
  if (!spec) return '';
  const items = parseSpecItems(spec);
  if (items.length === 0) return `<tr><td class="modal-spec-col-type"></td><td class="modal-spec-col-sizes">${spec}</td></tr>`;

  let html = '';
  let hasAlbum = false;
  items.forEach((item, idx) => {
    if (item.isAlbum && !hasAlbum) {
      // 相册名前加分隔行
      hasAlbum = true;
      html += `<tr><td colspan="2" class="modal-spec-divider"></td></tr>`;
    }
    html += `
      <tr class="${item.isAlbum ? 'modal-spec-album-row' : ''}">
        <td class="modal-spec-col-type ${item.isAlbum ? 'modal-spec-col-album' : ''}">${item.type}</td>
        <td class="modal-spec-col-sizes">${item.sizes.map(s =>
          `<span class="modal-size-chip">${s}</span>`
        ).join('')}</td>
      </tr>`;
  });
  return html;
}

// ==================== 渲染产品 ====================
function getImgSrc(product) {
  const filename = IMG_MAP[product.name];
  if (filename) return IMG_BASE + filename;
  // 尝试直接匹配
  return IMG_BASE + product.name + '.jpg';
}

function renderProducts(filter) {
  const wrap = document.getElementById('productsWrap');
  wrap.innerHTML = '';

  filter = (filter || '').toUpperCase().trim();

  // 按首字母过滤
  let filtered = UNIQUE_PRODUCTS;
  if (filter) {
    filtered = UNIQUE_PRODUCTS.filter(p => p.pinyin.toUpperCase().startsWith(filter));
  }

  if (filtered.length === 0) {
    document.getElementById('emptyState').classList.add('show');
    document.getElementById('resultCount').innerHTML = '';
    return;
  }
  document.getElementById('emptyState').classList.remove('show');

  // 统计信息
  document.getElementById('resultCount').innerHTML = filter
    ? `共找到 <strong>${filtered.length}</strong> 款匹配产品`
    : `全部 <strong>${filtered.length}</strong> 款产品`;

  // 按首字母分组
  const groups = {};
  filtered.forEach(p => {
    const letter = getFirstLetter(p.pinyin);
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(p);
  });

  const sortedLetters = Object.keys(groups).sort();

  sortedLetters.forEach(letter => {
    // 分组标题（只在多组或全部展示时显示）
    if (!filter || filter.length === 0) {
      const gtDiv = document.createElement('div');
      gtDiv.className = 'group-title';
      gtDiv.innerHTML = `
        <div class="letter-badge">${letter}</div>
        <div class="group-name">${groups[letter].length} 款产品</div>
      `;
      wrap.appendChild(gtDiv);
    }

    const grid = document.createElement('div');
    grid.className = 'product-grid';
    wrap.appendChild(grid);

    groups[letter].forEach((product, idx) => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.style.animationDelay = (idx * 0.04) + 's';

      const imgSrc = getImgSrc(product);

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${imgSrc}" alt="${product.name}" 
            onerror="this.parentNode.innerHTML='<div class=\\'card-img-placeholder\\'><div class=\\'ph-icon\\'>🖼</div><div class=\\'ph-text\\'>效果图</div></div>'"
            loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-name">${product.name}</div>
          ${product.spec ? '<div class="card-spec-label">SPEC · 规格</div>' : ''}
          <div class="card-spec">${renderSpecTags(product.spec)}</div>
        </div>
      `;
      card.addEventListener('click', () => openModal(product));
      grid.appendChild(card);
    });
  });
}

// ==================== 弹窗 ====================
function openModal(product) {
  const imgSrc = getImgSrc(product);
  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  content.innerHTML = `
    <div style="position:relative">
      <div class="modal-img-wrap">
        <img src="${imgSrc}" alt="${product.name}"
          onerror="this.parentNode.style.background='#f5f2ed';this.style.display='none'">
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-content">
      ${product.spec ? `
        <div class="modal-section-title">产品规格</div>
        <table class="modal-spec-table">
          ${renderModalSpec(product.spec)}
        </table>
      ` : ''}
      ${product.intro ? `
        <div class="modal-section-title">产品简介</div>
        <p class="modal-intro">${product.intro}</p>
      ` : ''}
    </div>
  `;

  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}



function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ==================== 搜索 & 字母筛选 ====================
let currentFilter = '';

function buildAlphaBar() {
  const bar = document.getElementById('alphaBar');
  // 全部按钮
  const allBtn = document.createElement('button');
  allBtn.className = 'alpha-btn all-btn active';
  allBtn.textContent = '全部';
  allBtn.id = 'btn-all';
  allBtn.addEventListener('click', () => {
    setFilter('');
  });
  bar.appendChild(allBtn);

  allLetters.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'alpha-btn';
    btn.id = 'btn-' + letter;
    btn.textContent = letter;
    btn.addEventListener('click', () => {
      setFilter(letter);
    });
    bar.appendChild(btn);
  });
}

function setFilter(val) {
  currentFilter = val.toUpperCase();

  // 更新按钮状态
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  if (!val) {
    const ab = document.getElementById('btn-all');
    if (ab) ab.classList.add('active');
  } else {
    const ab = document.getElementById('btn-' + val.toUpperCase());
    if (ab) ab.classList.add('active');
  }

  // 同步输入框
  const input = document.getElementById('searchInput');
  input.value = val;
  document.getElementById('searchClear').classList.toggle('show', !!val);

  renderProducts(val);
}

function clearSearch() {
  setFilter('');
  document.getElementById('searchInput').focus();
}

// 输入框监听
document.getElementById('searchInput').addEventListener('input', function() {
  const val = this.value.trim().toUpperCase();
  document.getElementById('searchClear').classList.toggle('show', !!val);

  // 高亮对应字母按钮
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  if (!val) {
    const ab = document.getElementById('btn-all');
    if (ab) ab.classList.add('active');
  } else {
    // 找匹配的字母
    const ab = document.getElementById('btn-' + val[0]);
    if (ab) ab.classList.add('active');
  }

  currentFilter = val;
  renderProducts(val);
});

// 弹窗触摸滑动关闭
let touchStartY = 0;
document.getElementById('modalBox').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('modalBox').addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 80 && document.getElementById('modalBox').scrollTop <= 0) {
    document.getElementById('modalOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }
}, { passive: true });

// ==================== 初始化 ====================
buildAlphaBar();
renderProducts('');
</script>
